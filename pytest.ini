[pytest]
# ── Test discovery ────────────────────────────────────────────────────
testpaths = tests

# ── Python path — makes "import api.agents.*" work from project root ──
pythonpath = .

# ── Default options ───────────────────────────────────────────────────
# -v      Verbose output (show each test name)
# --tb=short  Short tracebacks (readable without walls of text)
# -p no:warnings  Suppress import warnings from heavy deps (crewai, etc.)
addopts =
    -v
    --tb=short
    -p no:warnings

# ── asyncio mode (for pytest-asyncio) ────────────────────────────────
asyncio_mode = auto

# ── Coverage defaults (used when --cov flag is passed) ────────────────
[coverage:run]
source = api/agents
omit =
    */__pycache__/*
    */tests/*

[coverage:report]
show_missing = True
skip_covered  = False
